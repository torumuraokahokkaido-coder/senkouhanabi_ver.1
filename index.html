<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>線香花火 火花自動分析アプリ (爆速版)</title>
    <!-- グラフ描画用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Excel出力用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; margin: 10px auto; max-width: 900px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls, .metrics, .manual-edit { margin-top: 15px; }
        .metrics { display: flex; justify-content: space-around; background: #e9ecef; padding: 15px; border-radius: 8px; font-weight: bold; }
        canvas { border: 1px solid #ccc; max-width: 100%; border-radius: 4px; background: #000; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; margin: 3px; }
        button:hover { opacity: 0.8; }
        .btn-primary { background: #0d6efd; color: white; }
        .btn-success { background: #198754; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        input[type="range"] { width: 80%; }
        input[type="text"] { width: 70%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #statusMsg { color: #0d6efd; font-weight: bold; margin: 10px 0; }
        .tab-box { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>🎆 線香花火 自動分析アプリ</h2>

    <div class="card">
        <h3>1. 動画の準備（どちらかを選択）</h3>
        
        <!-- ファイル選択 or Google Drive リンク -->
        <div class="tab-box">
            <p><strong>📂 パソコン/スマホから選択:</strong></p>
            <input type="file" id="videoUpload" accept="video/*">
            
            <p style="margin-top: 15px;"><strong>🔗 Google Drive の共有リンクから読み込み:</strong></p>
            <input type="text" id="driveUrlInput" placeholder="https://drive.google.com/file/d/XXXXX/view?usp=sharing">
            <button class="btn-primary" id="btnLoadUrl">読み込む</button>
        </div>

        <div class="controls" id="videoControls" style="display:none;">
            <video id="videoElement" width="400" controls style="margin: 0 auto; display:block;"></video>
            <br>
            <button class="btn-warning" id="btnSetStart">📍 スタート位置を設定 (着火時)</button>
            <button class="btn-warning" id="btnSetEnd">📍 エンド位置を設定 (終了時)</button>
            <p>分析範囲: <span id="timeRangeText">0.00 秒 〜 動画の最後まで</span></p>
            <button class="btn-primary" id="btnAnalyze" style="font-size: 1.1em;">🚀 自動解析スタート！</button>
        </div>
        <p id="statusMsg"></p>
    </div>

    <div class="card" id="resultsCard" style="display: none;">
        <h3>2. 分析結果サマリー</h3>
        <div class="metrics">
            <div>⏱️ 合計時間<br><span id="valTotalTime">0</span> 秒</div>
            <div>🎇 総火花数<br><span id="valTotalSparks">0</span> 個</div>
            <div>🌸 牡丹<br><span id="valBotan">0</span> 秒</div>
            <div>🌲 松葉<br><span id="valMatsuba">0</span> 秒</div>
            <div>🍂 散り菊<br><span id="valChirigiku">0</span> 秒</div>
        </div>

        <div style="margin-top:20px;">
            <canvas id="chartCanvas" height="100"></canvas>
        </div>

        <hr style="margin:20px 0;">

        <h3>3. 手動修正 ＆ データ保存</h3>
        <div class="manual-edit">
            <canvas id="previewCanvas"></canvas>
            <br>
            <input type="range" id="timeSlider" min="0" max="100" value="0" step="1">
            <p>時間: <span id="lblCurrentTime">0.00</span> 秒 | 記録された火花数: <span id="lblCurrentCount">0</span> 個</p>
            <button class="btn-danger" id="btnMinus">➖ 減らす</button>
            <button class="btn-success" id="btnPlus">➕ 増やす</button>
        </div>
        <div style="margin-top:20px;">
            <button class="btn-primary" id="btnExport" style="font-size: 1.2em;">💾 Excel (スプレッドシート) で保存</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctxPreview = previewCanvas.getContext('2d', { willReadFrequently: true });
        
        let startTime = 0;
        let endTime = 0;
        let analysisData = [];
        let isAnalyzing = false;
        let chartInstance = null;

        // 動画セット共通処理
        function setupVideo(src) {
            video.src = src;
            document.getElementById('videoControls').style.display = 'block';
            video.onloadedmetadata = () => {
                endTime = video.duration;
                updateRangeText();
            };
        }

        // 1-A. ローカルファイル選択
        document.getElementById('videoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) setupVideo(URL.createObjectURL(file));
        });

        // 1-B. Google Drive URL指定
        document.getElementById('btnLoadUrl').addEventListener('click', () => {
            const url = document.getElementById('driveUrlInput').value.trim();
            if(!url) return alert("Google DriveのURLを入力してください。");
            
            // Google Driveの共有リンクからファイルIDを抽出
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if(match && match[1]) {
                const fileId = match[1];
                const directUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
                setupVideo(directUrl);
            } else {
                alert("有効なGoogle DriveのURLではありません。リンクを確認してください。");
            }
        });

        // スタート/エンド範囲設定
        document.getElementById('btnSetStart').addEventListener('click', () => {
            startTime = video.currentTime;
            updateRangeText();
        });
        document.getElementById('btnSetEnd').addEventListener('click', () => {
            endTime = video.currentTime;
            updateRangeText();
        });
        function updateRangeText() {
            document.getElementById('timeRangeText').innerText = `${startTime.toFixed(2)} 秒 〜 ${endTime.toFixed(2)} 秒`;
        }

        // 2. 超軽量な火花色（HSV）自動カウント処理
        function detectSparks() {
            const width = previewCanvas.width;
            const height = previewCanvas.height;
            const imgData = ctxPreview.getImageData(0, 0, width, height);
            const data = imgData.data;
            const visited = new Uint8Array(width * height);
            let count = 0;

            const step = 3; // 高速化のため3ピクセル刻みで検査
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x);
                    if (visited[idx]) continue;

                    const pIdx = idx * 4;
                    const r = data[pIdx], g = data[pIdx+1], b = data[pIdx+2];

                    // RGBから簡易HSV判定 (オレンジ〜黄色の明るい光)
                    const max = Math.max(r, g, b), min = Math.min(r, g, b);
                    const v = max;
                    const s = max === 0 ? 0 : (max - min) / max;

                    // 火花判定条件: 明るく(V>180)、鮮やか(S>0.3)、赤〜黄色成分強め(R>G>B)
                    if (v > 180 && s > 0.3 && r > b && g > b) {
                        count++;
                        // 周辺領域を訪問済みにマークして重なるカウントを防止
                        for (let dy = -6; dy <= 6; dy += 3) {
                            for (let dx = -6; dx <= 6; dx += 3) {
                                const ny = y + dy, nx = x + dx;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    visited[ny * width + nx] = 1;
                                }
                            }
                        }
                    }
                }
            }
            return count;
        }

        // 解析スタートボタン
        document.getElementById('btnAnalyze').addEventListener('click', () => {
            isAnalyzing = true;
            analysisData = [];
            document.getElementById('statusMsg').innerText = "⏳ 解析中...";
            document.getElementById('btnAnalyze').disabled = true;
            document.getElementById('resultsCard').style.display = 'none';

            previewCanvas.width = video.videoWidth;
            previewCanvas.height = video.videoHeight;
            video.currentTime = startTime;
        });

        // コマ送り解析
        video.addEventListener('seeked', function() {
            if(!isAnalyzing) return;

            ctxPreview.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
            const sparkCount = detectSparks();

            analysisData.push({ time: video.currentTime - startTime, count: sparkCount });

            let nextTime = video.currentTime + 0.1; // 0.1秒刻み
            if (nextTime <= endTime) {
                video.currentTime = nextTime;
            } else {
                isAnalyzing = false;
                document.getElementById('statusMsg').innerText = "🎉 解析完了！";
                document.getElementById('btnAnalyze').disabled = false;
                showResults();
            }
        });

        // 3. 結果表示 ＆ 3フェーズ算出
        function showResults() {
            document.getElementById('resultsCard').style.display = 'block';
            
            let counts = analysisData.map(d => d.count);
            let totalSparks = counts.reduce((a, b) => a + b, 0);
            let maxSparks = Math.max(...counts, 0);
            let totalDuration = analysisData.length > 0 ? analysisData[analysisData.length - 1].time : 0;
            
            let threshold = maxSparks * 0.3;
            let startIdx = counts.findIndex(c => c >= threshold);
            let endIdx = counts.length - 1 - [...counts].reverse().findIndex(c => c >= threshold);
            
            if(startIdx === -1) startIdx = 0;
            if(endIdx < 0 || endIdx >= counts.length) endIdx = counts.length - 1;

            let timeBotan = analysisData[startIdx] ? analysisData[startIdx].time : 0;
            let timeMatsuba = analysisData[endIdx] ? (analysisData[endIdx].time - timeBotan) : 0;
            let timeChirigiku = Math.max(0, totalDuration - (timeBotan + timeMatsuba));

            document.getElementById('valTotalTime').innerText = totalDuration.toFixed(2);
            document.getElementById('valTotalSparks').innerText = totalSparks;
            document.getElementById('valBotan').innerText = timeBotan.toFixed(2);
            document.getElementById('valMatsuba').innerText = timeMatsuba.toFixed(2);
            document.getElementById('valChirigiku').innerText = timeChirigiku.toFixed(2);

            drawChart();

            const slider = document.getElementById('timeSlider');
            slider.max = analysisData.length - 1;
            slider.value = 0;
            updateManualPreview();
        }

        function drawChart() {
            const ctxChart = document.getElementById('chartCanvas').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: analysisData.map(d => d.time.toFixed(1) + 's'),
                    datasets: [{
                        label: '火花の数',
                        data: analysisData.map(d => d.count),
                        borderColor: '#ffc107',
                        backgroundColor: 'rgba(255, 193, 7, 0.2)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: { responsive: true, animation: false }
            });
        }

        // 4. 手動修正
        document.getElementById('timeSlider').addEventListener('input', updateManualPreview);
        
        function updateManualPreview() {
            let idx = parseInt(document.getElementById('timeSlider').value);
            if(!analysisData[idx]) return;
            
            let data = analysisData[idx];
            document.getElementById('lblCurrentTime').innerText = data.time.toFixed(2);
            document.getElementById('lblCurrentCount').innerText = data.count;
            
            if(!isAnalyzing) {
                video.currentTime = startTime + data.time;
                setTimeout(() => {
                    ctxPreview.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
                    ctxPreview.font = "bold 40px sans-serif";
                    ctxPreview.fillStyle = "#0f0";
                    ctxPreview.fillText(`Count: ${data.count}`, 30, 60);
                }, 100);
            }
        }

        document.getElementById('btnPlus').addEventListener('click', () => {
            let idx = parseInt(document.getElementById('timeSlider').value);
            analysisData[idx].count += 1;
            updateManualPreview();
            showResults();
        });
        
        document.getElementById('btnMinus').addEventListener('click', () => {
            let idx = parseInt(document.getElementById('timeSlider').value);
            if(analysisData[idx].count > 0) analysisData[idx].count -= 1;
            updateManualPreview();
            showResults();
        });

        // 5. Excel出力
        document.getElementById('btnExport').addEventListener('click', () => {
            let summarySheet = XLSX.utils.json_to_sheet([{
                "合計時間(秒)": parseFloat(document.getElementById('valTotalTime').innerText),
                "総火花数(個)": parseInt(document.getElementById('valTotalSparks').innerText),
                "牡丹の時間(秒)": parseFloat(document.getElementById('valBotan').innerText),
                "松葉の時間(秒)": parseFloat(document.getElementById('valMatsuba').innerText),
                "散り菊の時間(秒)": parseFloat(document.getElementById('valChirigiku').innerText)
            }]);

            let rawData = analysisData.map(d => ({
                "時間 (秒)": parseFloat(d.time.toFixed(2)),
                "火花数": d.count
            }));
            let dataSheet = XLSX.utils.json_to_sheet(rawData);

            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, summarySheet, "分析サマリー");
            XLSX.utils.book_append_sheet(wb, dataSheet, "時系列データ");
            XLSX.writeFile(wb, "Hanabi_Analysis_Result.xlsx");
        });
    </script>
</body>
</html>
